# Copy this file to HMS_frontend/.github/workflows/deploy-backend.yml
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST         - the Elastic IP from `terraform output backend_public_ip`
#   EC2_USER         - "ec2-user"
#   EC2_SSH_KEY      - contents of the private key file (~/.ssh/hms-deploy-key)
#
# See docs/06-github-actions-cicd.md for how to add these.
#
# Note: the runner checks out the repo itself (it already has access via
# GitHub's built-in token) and copies just backend/ to the EC2 instance over
# SCP. The EC2 instance never needs any GitHub credentials - it doesn't
# clone anything, since HMS_frontend is a private repo.

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy backend source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/*,backend/.dockerignore"
          target: "/opt/app/backend_new"
          strip_components: 1
          overwrite: true

      - name: Build image and restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # /opt/app/backend/.env is created once manually (docs/05) and
            # lives outside of what CI copies - preserve it across deploys.
            mkdir -p /opt/app/backend
            if [ -f /opt/app/backend/.env ]; then
              cp /opt/app/backend/.env /opt/app/backend_new/.env
            fi
            rm -rf /opt/app/backend
            mv /opt/app/backend_new /opt/app/backend

            cd /opt/app/backend
            docker build -t hms-backend:latest .

            docker stop hms-backend 2>/dev/null || true
            docker rm hms-backend 2>/dev/null || true

            docker run -d \
              --name hms-backend \
              --restart unless-stopped \
              -p 80:5000 \
              --env-file /opt/app/backend/.env \
              hms-backend:latest

            # Wait for the container's own HEALTHCHECK to report healthy.
            # MongoDB Atlas (M0 tier) connection setup can take ~30s on its
            # own, so this needs real margin beyond that.
            for i in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' hms-backend 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "Backend is healthy"
                exit 0
              fi
              echo "Waiting for health check... ($status)"
              sleep 5
            done

            echo "Backend did not become healthy in time"
            docker logs --tail 50 hms-backend
            exit 1
