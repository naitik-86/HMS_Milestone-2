# Copy this file to HMS_frontend/.github/workflows/deploy-frontend.yml
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID       - from `hms-github-actions-deployer` IAM user (docs/02)
#   AWS_SECRET_ACCESS_KEY   - from the same IAM user
#   S3_FRONTEND_BUCKET      - `terraform output frontend_bucket_name`
#   VITE_BACKEND_URL        - e.g. http://<EC2_HOST>  (or your domain, later)
#
# See docs/06-github-actions-cicd.md for how to add these.

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/main-app/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/main-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/main-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_FRONTEND_BUCKET }}" --delete
