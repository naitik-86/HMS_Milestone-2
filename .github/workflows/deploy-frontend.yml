# Copy this file to HMS_frontend/.github/workflows/deploy-frontend.yml
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID       - from `hms-github-actions-deployer` IAM user (docs/02)
#   AWS_SECRET_ACCESS_KEY   - from the same IAM user
#   S3_FRONTEND_BUCKET      - `terraform output frontend_bucket_name`
#   VITE_BACKEND_URL        - e.g. http://<EC2_HOST>/api/v1 - MUST include /api/v1,
#                             see docs/10-application-notes.md
#   VITE_PAYU_BASE_URL      - PayU payment page URL, e.g. https://test.payu.in/_payment
#                             for sandbox/test, https://secure.payu.in/_payment for
#                             production. Used by PaymentPage.jsx to set the payment
#                             form's target - if unset, the form posts to the
#                             frontend's own origin as literal path "/undefined".
#   EC2_HOST, EC2_USER, EC2_SSH_KEY - same as deploy-backend.yml, reused here
#                             to also deploy the frontend to EC2:8080 as a
#                             fallback for networks that block S3 website
#                             endpoints (see docs/06)
#   VITE_GOOGLE_CLIENT_ID   - Google OAuth client ID for the "Continue with
#                             Google" button (Google Identity Services).
#                             Must match the backend's GOOGLE_CLIENT_ID env
#                             var exactly, or token verification fails.
#
# See docs/06-github-actions-cicd.md for how to add these.
#
# Note: no CloudFront invalidation step here - this testing server is
# accessed by plain IP:port, no CloudFront distribution in front of it.

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/main-app/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

# Only one deploy at a time - avoids two concurrent `aws s3 sync --delete`
# runs against the same bucket interleaving.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/main-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/main-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_PAYU_BASE_URL: ${{ secrets.VITE_PAYU_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          # Hashed assets (filename changes every build): cache forever.
          aws s3 sync dist/ "s3://${{ secrets.S3_FRONTEND_BUCKET }}" --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          # index.html: never cache, so browsers always fetch the latest
          # build reference instead of an old cached bundle hash.
          aws s3 cp dist/index.html "s3://${{ secrets.S3_FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Copy build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/main-app/dist/*,frontend/main-app/nginx.conf"
          target: "/opt/app/frontend_new"
          strip_components: 2
          overwrite: true

      - name: Restart nginx container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            rm -rf /opt/app/frontend
            mv /opt/app/frontend_new /opt/app/frontend

            docker rm -f hms-frontend 2>/dev/null || true

            docker run -d \
              --name hms-frontend \
              --restart unless-stopped \
              -p 8080:80 \
              -v /opt/app/frontend/dist:/usr/share/nginx/html:ro \
              -v /opt/app/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              nginx:alpine

            sleep 3
            curl -sf http://localhost:8080 > /dev/null && echo "Frontend on :8080 is serving" || (echo "Frontend on :8080 failed to respond" && exit 1)
