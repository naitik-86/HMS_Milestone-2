server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unlike S3 static website hosting, this serves index.html
    # with a real 200 status for any path (e.g. direct navigation/refresh on
    # /login works correctly here, unlike the known S3-hosting limitation).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
